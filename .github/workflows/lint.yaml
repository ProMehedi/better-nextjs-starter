name: Lint and Typecheck

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: bun install
      - run: bun lint
      - run: bun typecheck
